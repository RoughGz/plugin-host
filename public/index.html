<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plugin Bridge</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
      }
      h1 {
        font-size: 1.3rem;
      }
      input,
      button {
        font-size: 1rem;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      input {
        width: 100%;
      }
      button {
        margin-top: 0.5rem;
        cursor: pointer;
      }
      .url {
        word-break: break-all;
        background: #f4f4f4;
        padding: 0.75rem;
        border-radius: 6px;
        margin-top: 1rem;
      }
      .url a {
        color: #06c;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        margin: 0.5rem 0;
      }
      .hint {
        color: #666;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Plugin Bridge</h1>
    <p class="hint">
      Paste a plugin URL (a <code>.sky</code> bundle or
      <code>plugin.js</code> link) and get an addon URL to paste into Stremio /
      Nuvio. Nothing is installed on the server — the addon URL carries the
      plugin link itself.
    </p>
    <input
      id="url"
      placeholder="https://raw.githubusercontent.com/.../plugin.sky"
      spellcheck="false"
    />
    <button onclick="makeUrl()">Generate addon URL</button>
    <div class="url" id="out" hidden></div>
    <h2>Bookmarked plugins</h2>
    <ul id="list"></ul>
    <script>
      function b64url(s) {
        return btoa(unescape(encodeURIComponent(s)))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");
      }
      function makeUrl() {
        const raw = document.getElementById("url").value.trim();
        const out = document.getElementById("out");
        if (!/^https?:\/\//.test(raw)) {
          out.textContent = "enter a valid https URL";
          out.hidden = false;
          return;
        }
        const addon =
          location.origin + "/plugin/" + b64url(raw) + "/manifest.json";
        out.innerHTML = '<a href="' + addon + '">' + addon + "</a>";
        out.hidden = false;
      }
      fetch("api/plugins")
        .then((r) => r.json())
        .then((d) => {
          const ul = document.getElementById("list");
          for (const p of d.plugins || []) {
            const li = document.createElement("li");
            li.innerHTML =
              "<strong>" +
              p.name +
              "</strong> — <a href='" +
              p.addonUrl +
              "'>" +
              p.addonUrl +
              "</a>";
            ul.appendChild(li);
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
