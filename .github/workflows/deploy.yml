name: Deploy to BeamUp
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BEAMUP_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan a.baby-beamup.club >> ~/.ssh/known_hosts
      - name: Deploy
        run: |
          git remote add beamup dokku@a.baby-beamup.club:${{ vars.BEAMUP_APP_ID }}/${{ vars.BEAMUP_PROJECT_NAME }}
          git push beamup HEAD:main --force
      - name: Verify
        run: |
          sleep 30
          curl -sf https://${{ vars.BEAMUP_APP_ID }}-${{ vars.BEAMUP_PROJECT_NAME }}.baby-beamup.club/ \
            && echo "Deployed OK" || echo "Warning: may still be starting up"
